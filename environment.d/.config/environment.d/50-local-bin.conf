# ~/.local/bin no PATH da sessão gráfica.
#
# Antes só entrava via ~/.bashrc, que o `systemd --user` / uwsm não lê. Efeito:
# o grootshell (lançado por `uwsm app -- qs`) não achava `matugen`, então
# generate-theme.sh morria com "matugen is not on PATH" e o tema nunca
# regenerava a partir do wallpaper — a shell ficava presa no fallback
# catppuccin compilado. systemd expande ${PATH} aqui.
PATH=%h/.local/bin:%h/bin:${PATH}
