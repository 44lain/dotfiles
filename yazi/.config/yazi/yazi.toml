# ~/.config/yazi/yazi.toml
# Docs: https://yazi-rs.github.io/docs/configuration/yazi
# yazi funciona bem sem nada disto — mexa à vontade.

[mgr]
ratio          = [1, 3, 4]   # largura das 3 colunas: pai / atual / preview
sort_by        = "natural"   # 2 antes de 10
sort_dir_first = true         # pastas no topo
sort_sensitive = false
linemode       = "size"      # mostra tamanho à direita (mtime, permissions, ...)
show_hidden    = false        # alterne com  .  dentro do yazi
show_symlink   = true
scrolloff      = 5

[preview]
tab_size    = 2
max_width   = 1200
max_height  = 1200
image_delay = 30             # ms antes de renderizar imagem (kitty graphics)

[opener]
edit = [
  { run = '${EDITOR:-nvim} "$@"', block = true, desc = "editor", for = "unix" },
]
open = [
  { run = 'xdg-open "$@"', desc = "xdg-open", orphan = true, for = "linux" },
]
reveal = [
  { run = 'xdg-open "$(dirname "$1")"', desc = "abrir pasta", orphan = true, for = "linux" },
]

[open]
prepend_rules = [
  { url = "*.md", use = "edit" },
]
