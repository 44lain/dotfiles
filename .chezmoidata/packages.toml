# Every dependency the rice touches, once. Read by `rice doctor` (missing
# tools + the exact install command) and rendered into docs/dependencies.md
# (`make docs`). Adding a dependency = one block here.
#
#   desc         what it is for
#   section      grouping in docs/dependencies.md
#   bin          command looked up on PATH ("" = documentation only, not checked)
#   required     true = `rice doctor` FAILs when missing, else WARN
#   fedora/debian/arch   package name; "" = not packaged for that family
#   note_<family>        extra hint printed next to the package
#   manual       what to do when there is no package
#   min_version  oldest usable version (used to explain an apt release that is too old)
#   check        for items with no `bin`: "font:<Family>" or "path:<path>" — how the
#                installer's scan sees them as installed (doc-only items have neither)
#   [recipe]     how the installer gets it where the distro has no package; see
#                docs/superpowers/specs/2026-09-30-guided-installer-design.md §1.
#                kinds: release-binary, fonts, git-clone (fallbacks, used only when the
#                family has no package name) and apt-repo, dnf-copr (repository
#                prerequisites, used whenever the family matches). Every download is
#                pinned to a version with sha256.
#
# "debian" means every Debian-family distro (Debian, Ubuntu, Mint, Kali,
# Parrot, Pop!_OS...): they share the apt package names.

[packages.hyprland]
desc        = "compositor"
section     = "Compositor & session"
bin         = "Hyprland"
required    = true
min_version = "0.55"
fedora      = "hyprland"
debian      = "hyprland"
arch        = "hyprland"
note_debian = "Debian only (never add Debian repositories on Ubuntu, Linux Mint or Pop!_OS: it breaks the system; there you need a release that ships Hyprland 0.55+ or a source build). On Debian stable the usable Hyprland is only in the release's backports repository: add the line `deb http://deb.debian.org/debian <release>-backports main` (see https://backports.debian.org/Instructions/), run `sudo apt update`, then `sudo apt install -t <release>-backports hyprland`; Parrot already has backports enabled, so the printed command works as-is there"
note_fedora = "stock Fedora has no Hyprland stack: first run 'sudo dnf copr enable sdegler/hyprland' (also provides hypridle, hyprlock, hyprpaper, hyprpolkitagent, uwsm, cliphist)"

[packages.hyprland.recipe]
kind = "dnf-copr"
name = "sdegler/hyprland"

