# Every dependency the rice touches, once. Read by `rice doctor` (missing
# tools + the exact install command) and rendered into docs/dependencies.md
# (`make docs`). Adding a dependency = one block here.
#
#   desc         what it is for
#   section      grouping in docs/dependencies.md
#   bin          command looked up on PATH ("" = documentation only, not checked)
#   required     true = `rice doctor` FAILs when missing, else WARN
#   fedora/debian/arch   package name; "" = not packaged for that family
#   note_<family>        extra hint printed next to the package
#   manual       what to do when there is no package
#   min_version  oldest usable version (used to explain an apt release that is too old)
#
# "debian" means every Debian-family distro (Debian, Ubuntu, Mint, Kali,
# Parrot, Pop!_OS...): they share the apt package names.

[packages.hyprland]
desc        = "compositor"
section     = "Compositor & session"
bin         = "Hyprland"
required    = true
min_version = "0.55"
fedora      = "hyprland"
debian      = "hyprland"
arch        = "hyprland"
note_debian = "stable releases keep an old version in the main repo; the newer one is in a backports repo — the command above accounts for that"
note_fedora = "stock Fedora has no Hyprland stack: first run 'sudo dnf copr enable sdegler/hyprland' (also provides hypridle, hyprlock, hyprpaper, hyprpolkitagent, uwsm, cliphist)"

