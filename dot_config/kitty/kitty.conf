# kitty — baseline. Cores geradas pelo grootshell/matugen a partir do wallpaper.

font_family      CaskaydiaCove Nerd Font Mono
font_size        11.0
adjust_line_height 100%

cursor_shape          beam
cursor_blink_interval 0

scrollback_lines      10000
enable_audio_bell     no
window_padding_width  6
confirm_os_window_close 0

# Vidro fosco: janela translúcida + o blur global do Hyprland
# (decoration:blur no hyprland.lua) preenche o fundo com o wallpaper borrado.
# dynamic_ permite ajustar em runtime com kitty @ set-background-opacity.
background_opacity        0.85
dynamic_background_opacity yes

# Recarrega sozinho quando o arquivo muda (o generate-theme.sh também manda SIGUSR1).
allow_remote_control   no

# Paleta Material 3 do wallpaper atual. Recolore junto com o grootshell.
# Ausente até o primeiro `theme regenerate` / troca de wallpaper.
include colors-grootshell.conf
